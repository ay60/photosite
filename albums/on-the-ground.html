  <style>
    :root {
      color-scheme: light;
      --bg: #f7f4ed;
      --panel: #fffdf9;
      --text: #1f1a17;
      --muted: #695e58;
      --line: #d7cdc3;
      --accent: #a44a3f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(180deg, #efe4d1 0%, var(--bg) 260px);
      color: var(--text);
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 48px 24px 72px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 5vw, 4rem);
    }
    p {
      color: var(--muted);
      margin: 0 0 28px;
    }
    .back {
      display: inline-block;
      margin-bottom: 24px;
      color: var(--accent);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
    }
    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(71, 48, 32, 0.08);
    }
    .card img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: #efe5da;
    }
  </style>
</head>
